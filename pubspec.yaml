name: aether_player
description: A lightweight cross-platform music player.
publish_to: none
version: 1.0.0-abf+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  audio_service: ^0.18.18
  audio_metadata_reader: ^1.8.0
  dynamic_color: ^1.7.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: '>=2.5.3 <2.5.4'
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/icon/app_mark.svg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256